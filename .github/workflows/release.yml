name: release

# Build installable binaries for Linux, Windows and macOS and attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`), or run
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action creates/uploads a release, which needs write access.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          # Intel macOS (cross-compiled from the arm64 runner)
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
          # Linux (deb / rpm / AppImage)
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          # Windows (NSIS .exe + .msi)
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # The gstreamer plugin packages are copied into the AppImage by
          # bundleMediaFramework — without them WebKit's Web Audio (the
          # inter-station static) is silent in the released AppImage.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-alsa

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- Updater signing ----
          # With bundle.createUpdaterArtifacts enabled, tauri-action signs
          # every bundle with this minisign key and uploads the `.sig` files
          # plus a `latest.json` manifest to the release. The running app
          # verifies downloads against the matching public key embedded in
          # tauri.conf.json, and www.ltbr.fm/api/player/updater proxies the
          # manifest to the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- Code signing (optional) ----
          # IMPORTANT: only uncomment these once the secrets actually exist.
          # Passing them while empty makes the bundler attempt to import a
          # blank certificate and the macOS build fails at codesign.
          #
          # macOS signing + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LTBR·FM Receiver ${{ github.ref_name }}"
          # NOTE: update this body as part of each release's prep commit.
          releaseBody: |
            ### What's new

            - **Vintage 80s is now the default face.** New installs open on
              the backlit tuning-dial receiver instead of the rack unit;
              existing users' saved face choice is unaffected.

            ### Downloads

            `.dmg` (macOS — Apple Silicon & Intel) · `.msi` / `-setup.exe` (Windows) ·
            `.AppImage` / `.deb` / `.rpm` (Linux). Builds are unsigned:

            - **macOS** reports unsigned downloads as "damaged". After dragging the app
              to Applications, clear the quarantine flag once per update:
              `xattr -cr "/Applications/LTBR FM Receiver.app"`
            - **Windows**: SmartScreen → "More info" → "Run anyway".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  invalidate-cache:
    name: Invalidate player cache
    needs: build
    runs-on: ubuntu-latest
    steps:
      # /api/player/latest and /api/player/updater are cached on www.ltbr.fm;
      # bust that cache immediately so clients see the new release instead of
      # waiting for the cache to expire naturally.
      - name: Revalidate player cache
        run: |
          curl --fail --show-error --silent -X POST \
            https://www.ltbr.fm/api/player/revalidate \
            -H "Authorization: Bearer ${{ secrets.PLAYER_RELEASE_TOKEN_CACHE_INVALID }}"
