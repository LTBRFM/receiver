<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LTBR·FM — Receiver</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div class="unit" id="faceDefault">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <div class="face">

    <div class="brand-row">
      <div class="brand">LTBR<span class="dot">.</span><span class="fm">FM</span></div>
      <div class="strap">London Tower Block Radio</div>
      <div class="tx" id="txState" title="">
        <svg class="info" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1.2 15h-2.4v-6.5h2.4V17zm0-8.5h-2.4V6h2.4v2.5z"/></svg>
        <span class="led"></span><span id="txLabel">Standby</span>
      </div>
      <button class="power" id="btnPower" title="Power off" aria-label="Power off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 3.5v7.5"/>
          <path d="M7.2 6.4a7 7 0 1 0 9.6 0"/>
        </svg>
      </button>
    </div>

    <div class="windows">
      <div class="window w-scroll"><canvas id="scroller" height="78"></canvas></div>
      <div class="window w-spec"><canvas id="spectrum" height="78"></canvas></div>
    </div>

    <div class="transport">
      <div class="keys">
        <button class="key" id="btnPlay" aria-pressed="false" title="Play / Pause (Space)" aria-label="Play">
          <svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4l13 8-13 8z"/></svg>
        </button>
        <button class="key" id="btnStop" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></svg>
        </button>
        <button class="key" id="btnEq" aria-pressed="true" title="Graphic equaliser (E)" aria-label="Show or hide the graphic equaliser">
          <svg viewBox="0 0 24 24"><path d="M5 4h2v5H5zM4 10h4v3H4zM5 14h2v6H5zM11 4h2v9h-2zM10 14h4v3h-4zM11 18h2v2h-2zM17 4h2v3h-2zM16 8h4v3h-4zM17 12h2v8h-2z"/></svg>
        </button>
        <button class="key" id="btnMute" aria-pressed="false" title="Mute (M)" aria-label="Mute">
          <svg viewBox="0 0 24 24" id="icoVol"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5c1.4 1 1.4 6 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <!-- Latching key: switches between the station's DJ and no-DJ mounts.
             The LED shows what is on air, and blinks while the engine is
             bringing the other mount in behind the one playing. -->
        <button class="key key-text" id="btnNoDj" aria-pressed="false"
                title="No DJ — music and idents only (D)" aria-label="No DJ">
          <span class="key-led"></span>No DJ
        </button>
      </div>

      <div class="vol">
        <span class="lbl">Level</span>
        <div class="fader-h" id="volFader" tabindex="0" role="slider"
             aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <div class="slot"></div><div class="cap"></div>
        </div>
      </div>
    </div>

    <div class="eq">
      <div class="eq-head">
        <span class="title">Graphic Equaliser</span>
        <div class="presets">
          <button class="chip" data-preset="flat">Flat</button>
          <button class="chip" data-preset="pirate">Pirate</button>
          <button class="chip" data-preset="bass">Bass</button>
          <button class="chip" data-preset="voice">Voice</button>
        </div>
      </div>
      <div class="bands" id="bands"></div>
    </div>

  </div>
</div>

<!-- Vintage 80s UK receiver face — hidden until selected from the menu.
     Skeuomorphic chrome lives in faces/vintage/vintage.css; the dial glass
     and VU meters are canvases painted by faces/vintage/*.ts. -->
<div class="vunit" id="faceVintage" hidden>
  <div class="vface">

    <div class="vtop">
      <div class="vbrand">
        <span class="vname">LTBR<i>.</i>FM</span>
        <small>Wavemaster 3000 &nbsp;·&nbsp; Stereo FM Receiver &nbsp;·&nbsp; London</small>
        <!-- Pilot lamps under the wordmark: TUNED glows while a carrier is
             held; NO SIGNAL lights when the connection is lost (pulsing while
             the set hunts for it again). The full reason sits in the tooltip
             so the fascia itself never carries a line of error text. -->
        <div class="vlamps" id="vLamps" role="status" aria-live="polite">
          <span class="vlamp vlamp-tuned" id="vLampTuned"><i></i>Tuned</span>
          <span class="vlamp vlamp-fault" id="vLampFault"><i></i>No Signal</span>
        </div>
      </div>
      <div class="vmeters">
        <div class="vmeter"><canvas id="vVuL"></canvas></div>
        <div class="vmeter"><canvas id="vVuR"></canvas></div>
      </div>
    </div>

    <div class="vdial-bezel">
      <canvas id="vDial"></canvas>
      <div class="vdial-glass"></div>
    </div>

    <div class="vcontrols">
      <div class="vgroup vkeys-group">
        <div class="vkeys">
          <button class="vkey" id="vPower" aria-pressed="false"
                  title="Power" aria-label="Power">POWER<span class="vdot"></span></button>
          <button class="vkey" id="vMute" aria-pressed="false"
                  title="Mute" aria-label="Mute">MUTE</button>
          <button class="vkey" id="vEq"
                  title="Graphic equaliser" aria-label="Show or hide the graphic equaliser">EQ</button>
          <button class="vkey" id="vNoDj" aria-pressed="false"
                  title="No DJ — music and idents only" aria-label="No DJ">NO DJ<span class="vdot"></span></button>
        </div>
        <span class="vlbl">Function</span>
      </div>
      <div class="vgroup vgroup-vol">
        <div class="vknob" id="vknobVol" tabindex="0" role="slider"
             aria-label="Volume" aria-valuemin="0" aria-valuemax="100">
          <div class="vknob-cap"><div class="vknob-mark"></div></div>
        </div>
        <span class="vlbl">Volume</span>
      </div>
      <div class="vgroup vgroup-tune">
        <div class="vknob vknob-big" id="vknobTune" tabindex="0" role="slider"
             aria-label="Tuning" aria-valuemin="87.5" aria-valuemax="108.5">
          <div class="vknob-cap"><div class="vknob-mark"></div></div>
        </div>
        <span class="vlbl">Tuning</span>
      </div>
    </div>

    <div id="veqSlot"></div>

  </div>
</div>

<!-- "Amp" face — a late-90s desktop-player skin: silver chrome, blue LCD
     display rendered on a canvas (pixel font, time, kbps/kHz, stereo badge,
     mini analyser, scrolling title), round transport keys and the graphic
     equaliser docked underneath. Chrome in faces/amp/amp.css, display and
     wiring in faces/amp/amp.ts. -->
<div class="aunit" id="faceAmp" hidden>
  <div class="atitle">
    <span class="agrip"></span>
    <span class="aname">LTBR<i>·</i>FM</span>
    <span class="agrip"></span>
    <button class="atbtn" id="aShade" title="Shade mode (mini)" aria-label="Shade mode">
      <svg viewBox="0 0 8 8"><path d="M1 2h6v1H1zM2 4h4v1H2zM3 6h2v1H3z"/></svg>
    </button>
    <button class="atbtn" id="aClose" title="Power off" aria-label="Power off">
      <svg viewBox="0 0 8 8"><path d="M1.5 1L7 6.5 6.5 7 1 1.5zM6.5 1L7 1.5 1.5 7 1 6.5z"/></svg>
    </button>
  </div>

  <div class="amenu">
    <button class="amenu-item" id="aMenuFile">File</button>
    <button class="amenu-item" id="aMenuPlay">Play</button>
    <button class="amenu-item" id="aMenuOptions">Options</button>
    <button class="amenu-item" id="aMenuView">View</button>
    <button class="amenu-item" id="aMenuHelp">Help</button>
  </div>

  <div class="amain">
    <div class="arow">
      <div class="alcd"><canvas id="aDisplay" height="84"></canvas></div>
      <div class="aside">
        <button class="asmall" id="aSideMenu" title="Window options" aria-label="Window options">
          <svg viewBox="0 0 10 6"><path d="M1 1h8L5 5z"/></svg>
        </button>
        <div class="asidekey">
          <button class="asmall apill" id="aNoDj" aria-pressed="false" title="No DJ — music and idents only (D)" aria-label="No DJ">DJ</button>
          <span class="aled" id="aNoDjLed"></span>
        </div>
        <div class="asidekey">
          <button class="asmall apill" id="aOnTop" aria-pressed="false" title="Always on top" aria-label="Always on top">TOP</button>
          <span class="aled" id="aOnTopLed"></span>
        </div>
      </div>
    </div>

    <div class="atransport">
      <div class="aroundkeys">
        <button class="around aplay" id="aPlay" title="Play (Space)" aria-label="Play">
          <svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
        </button>
        <button class="around" id="aStop" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>
        </button>
      </div>
      <button class="aeject" id="aMute" aria-pressed="false" title="Mute (M)" aria-label="Mute">
        <svg viewBox="0 0 16 16"><path d="M2 6v4h3l4 3V3L5 6H2z"/><path d="M11 5.5c1.3 1 1.3 4 0 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="avol">
        <div class="fader-h afader" id="aVol" tabindex="0" role="slider"
             aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <div class="slot"></div><div class="cap"></div>
        </div>
      </div>
      <button class="atab" id="aEqTab" aria-pressed="true" title="Graphic equaliser (E)">EQ</button>
      <button class="abolt" id="aBolt" title="Open ltbr.fm" aria-label="Open ltbr.fm">
        <svg viewBox="0 0 12 16"><path d="M7 0L1 9h4l-1 7 7-10H7z"/></svg>
      </button>
    </div>
  </div>

  <div class="aeqpanel" id="aEqPanel">
    <div class="aeqleft">
      <canvas class="acurve" id="aCurve" width="72" height="30"></canvas>
      <div class="asidekey">
        <button class="asmall apill" id="aEqOn" aria-pressed="true" title="Equaliser on / off">ON</button>
        <span class="aled lit" id="aEqOnLed"></span>
      </div>
      <button class="asmall apill" id="aEqFlat" title="Reset all bands">FLAT</button>
    </div>
    <div class="aeqscale" aria-hidden="true"><span>+12 dB</span><span>0 dB</span><span>-12 dB</span></div>
    <div id="aeqSlot"></div>
  </div>

  <!-- Shade mode: the whole player folded into its title bar. -->
  <div class="ashade">
    <div class="ashade-lcd"><canvas id="aShadeDisplay" height="14"></canvas></div>
    <button class="ashade-btn" id="aShadePlay" title="Play" aria-label="Play"><svg viewBox="0 0 8 8"><path d="M2 1l5 3-5 3z"/></svg></button>
    <button class="ashade-btn" id="aShadeStop" title="Stop" aria-label="Stop"><svg viewBox="0 0 8 8"><path d="M1.5 1.5h5v5h-5z"/></svg></button>
    <button class="ashade-btn" id="aShadeExpand" title="Full player" aria-label="Full player"><svg viewBox="0 0 8 8"><path d="M1 6h6V5H1zM2 4h4V3H2zM3 2h2V1H3z"/></svg></button>
  </div>
</div>

<div class="ctx" id="ctxMenu" role="menu" aria-label="Window options">
  <button class="ctx-item" id="ctxOnTop" role="menuitemcheckbox" aria-checked="false">
    <span class="ctx-led"></span>Always on Top
  </button>
  <div class="ctx-sep"></div>
  <button class="ctx-item" id="ctxFaceDefault" role="menuitemradio" aria-checked="true">
    <span class="ctx-led"></span>Face: Receiver
  </button>
  <button class="ctx-item" id="ctxFaceVintage" role="menuitemradio" aria-checked="false">
    <span class="ctx-led"></span>Face: Vintage 80s
  </button>
  <button class="ctx-item" id="ctxFaceAmp" role="menuitemradio" aria-checked="false">
    <span class="ctx-led"></span>Face: Amp
  </button>
  <button class="ctx-item" id="ctxFaceMini" role="menuitemradio" aria-checked="false">
    <span class="ctx-led"></span>Face: Mini
  </button>
  <div class="ctx-sep"></div>
  <button class="ctx-item" id="ctxExit" role="menuitem">
    <span class="ctx-led"></span>Exit
  </button>
  <div class="ctx-version" id="ctxVersion" aria-hidden="true"></div>
</div>

<!-- Auto-update overlay: shown only while an update is actually downloading
     or installing; the whole flow is driven from Rust via update://state. -->
<div class="upd" id="updOverlay" hidden role="alertdialog" aria-live="assertive"
     aria-label="Updating the receiver">
  <div class="upd-panel">
    <div class="upd-title">
      <span class="upd-led"></span><span id="updTitle">Receiving update…</span>
    </div>
    <div class="upd-bar" id="updBar">
      <div class="upd-fill" id="updFill"></div>
      <div class="upd-sheen"></div>
    </div>
    <div class="upd-meta">
      <span id="updPct">0%</span>
      <span id="updBytes"></span>
    </div>
    <div class="upd-note" id="updNote">A new version is being tuned in — the receiver
      will restart by itself.</div>
  </div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
